services:
  web:
    container_name: francisjgarcia
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
      args:
        NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ../src:/app/src:ro
      - ../public:/app/public:ro
    environment:
      - NODE_ENV=development
      - PORT=3000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: on-failure
